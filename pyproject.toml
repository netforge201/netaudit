[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netaudit"
version = "0.1.0"
description = "NetAudit - a console Network Audit & Diagnostics Toolkit for network engineers."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "NetAudit Contributors" },
]
requires-python = ">=3.11"
keywords = ["network", "cli", "audit", "diagnostics", "netmiko", "scapy", "sysadmin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "scapy>=2.5.0",
    "netmiko>=4.3.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0.1",
    "httpx>=0.27.0",
    "dnspython>=2.6.0",
    "psutil>=5.9.8",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/example/netaudit"
Repository = "https://github.com/example/netaudit"
Issues = "https://github.com/example/netaudit/issues"

[project.scripts]
netaudit = "netaudit.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["netaudit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
